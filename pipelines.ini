[pipelines]
item_1 = 문서/명함 OCR(조명 균일)|선명한 텍스트 이진화|GaussianBlur(3×3) → AdaptiveThreshold(Gaussian) → Opening → Closing
item_2 = 문서/명함+조명 불균일|문서 테두리/텍스트 안정적 추출|Bilateral → AdaptiveThreshold → Closing → Canny(낮은 T) → Contour
item_3 = RealSense/L515 PnP|안정적인 엣지+Depth ROI|GaussianBlur(5×5) → Canny → Depth Mask → Closing
item_4 = 금속/PCB 고노이즈|반사/노이즈 줄인 엣지|MedianBlur(5~7) → GaussianBlur(3×3) → Canny → Closing
item_5 = 흐린 이미지 Edge|흐린 경계 보존|Unsharp Mask → GaussianBlur(3×3) → Canny
item_6 = 저조도/낮은 대비|대비/밝기 향상+엣지 안정화|CLAHE → GaussianBlur → Canny
item_7 = 객체 분리/배경 제거|깨끗한 객체 마스크|GaussianBlur(7×7) → Otsu Threshold → Closing → Largest Contour
item_8 = 객체 분리/배경 제거|깨끗한 객체 마스크|GaussianBlur(7×7) → Otsu Threshold → Closing → Largest Contour

